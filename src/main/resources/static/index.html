<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mystery Game</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- 타이틀 화면 -->
    <div id="title-screen" class="screen">

        <h1>MYSTERY GAME</h1>

        <p>Chapter 1 - Prototype</p>

        <button id="start-button">
            NEW GAME
        </button>

    </div>


    <!-- 게임 화면 -->
    <div id="game-screen" class="screen hidden">

        <!-- 게임 기능 버튼 영역 -->
        <div id="game-menu">

            <button id="save-button" type="button">
                SAVE
            </button>

            <button id="load-button" type="button">
                LOAD
            </button>

            <button id="log-button" type="button">
                LOG
            </button>

        </div>

        <div id="character">CHARACTER</div>

		<!-- 선택지 표시 영역 -->
		<div id="choice-container" class="choice-container hidden"></div>

        <div id="dialogue-box">

            <h2 id="speaker-name"></h2>

            <p id="dialogue-text"></p>

            <span id="next-indicator">▼</span>

        </div>

        <!-- 대화 기록 화면 -->
        <div id="log-overlay" class="hidden">

            <div id="log-panel">

                <div id="log-header">
                    <h2>DIALOGUE LOG</h2>

                    <button id="log-close-button" type="button">
                        ✕
                    </button>
                </div>

                <div id="log-list"></div>

            </div>

        </div>

    </div>

	<!-- 화면 전환 효과 -->
	<div id="transition-overlay"></div>

    <script type="module" src="/js/main.js"></script>

</body>
</html>
